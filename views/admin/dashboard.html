<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-200">
    <nav class="bg-slate-800 border-b border-slate-700">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <h1 class="text-2xl font-bold">Admin Dashboard</h1>
                <div class="space-x-4">
                    <a href="/admin/projects" class="text-blue-400 hover:text-blue-300">Manage Projects</a>
                    <a href="/admin/logout" class="text-red-400 hover:text-red-300">Logout</a>
                </div>
            </div>
        </div>
    </nav>
    
    <div class="container mx-auto px-4 py-8">
        <div class="grid md:grid-cols-3 gap-6 mb-8">
            <div class="bg-slate-800 p-6 rounded-lg">
                <h3 class="text-xl font-bold mb-2">Total Projects</h3>
                <p class="text-3xl font-bold text-blue-400">{{len .Projects}}</p>
            </div>
        </div>
        
        <div class="bg-slate-800 p-6 rounded-lg">
            <h2 class="text-2xl font-bold mb-4">Recent Projects</h2>
            {{if .Projects}}
            <div class="space-y-4">
                {{range .Projects}}
                <div class="bg-slate-700 p-4 rounded-lg">
                    <h3 class="font-bold">{{.Title}}</h3>
                    <p class="text-sm text-slate-400">{{.Description}}</p>
                </div>
                {{end}}
            </div>
            {{else}}
            <p class="text-slate-400">No projects yet. <a href="/admin/projects/create" class="text-blue-400">Create one</a></p>
            {{end}}
        </div>
    </div>
</body>
</html>
