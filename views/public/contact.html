{{template "layout.html" .}}

{{define "content"}}
<!-- Navigation -->
<nav class="fixed top-0 w-full bg-slate-900/80 backdrop-blur-md z-50 border-b border-slate-800">
    <div class="container mx-auto px-4 py-4">
        <div class="flex items-center justify-between">
            <div class="text-2xl font-bold text-white">
                <a href="/">Portfolio</a>
            </div>
            <div class="hidden md:flex space-x-6">
                <a href="/" class="hover:text-blue-400 transition">Home</a>
                <a href="/about" class="hover:text-blue-400 transition">About Me</a>
                <a href="/skills" class="hover:text-blue-400 transition">Skills</a>
                <a href="/experience" class="hover:text-blue-400 transition">Experience</a>
                <a href="/projects" class="hover:text-blue-400 transition">Projects</a>
                <a href="/services" class="hover:text-blue-400 transition">Services</a>
                <a href="/blog" class="hover:text-blue-400 transition">Blog</a>
                <a href="/contact" class="text-blue-400">Contact</a>
            </div>
        </div>
    </div>
</nav>

<!-- Contact Section -->
<section class="min-h-screen pt-32 px-4">
    <div class="container mx-auto max-w-2xl">
        <h1 class="text-4xl md:text-6xl font-bold mb-12 text-center" data-aos="fade-up">Contact</h1>
        
        <form class="bg-slate-800 p-8 rounded-lg space-y-6" data-aos="fade-up" data-aos-delay="200">
            <div>
                <label class="block mb-2">Name</label>
                <input type="text" class="w-full px-4 py-2 bg-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block mb-2">Email</label>
                <input type="email" class="w-full px-4 py-2 bg-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block mb-2">Message</label>
                <textarea rows="5" class="w-full px-4 py-2 bg-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>
            <button type="submit" class="w-full px-8 py-3 bg-blue-600 hover:bg-blue-700 rounded-lg transition">
                Send Message
            </button>
        </form>
    </div>
</section>
{{end}}
